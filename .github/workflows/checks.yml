name: checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  # ---------------------------------------------------------------------------
  # Static validation. Runs on Linux because none of it needs Windows: the
  # PowerShell sources are parsed, not executed, and the launcher's Windows-only
  # code paths (Get-NetTCPConnection, taskkill, CREATE_NO_WINDOW) are therefore
  # never touched here. A syntax error or a bad here-string fails the build.
  # ---------------------------------------------------------------------------
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse all PowerShell sources
        shell: pwsh
        run: |
          $failed = @()
          $files = @(Get-ChildItem -Recurse -Filter *.ps1)
          foreach ($f in $files) {
            $errors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$errors)
            if ($errors -and $errors.Count -gt 0) {
              $failed += $f.FullName
              Write-Host "::error file=$($f.FullName)::$($errors[0].Message)"
              $errors | Select-Object -First 5 | ForEach-Object {
                Write-Host "  line $($_.Extent.StartLineNumber): $($_.Message)"
              }
            } else {
              Write-Host "ok  $($f.Name)"
            }
          }
          if ($failed.Count -gt 0) { throw "$($failed.Count) PowerShell file(s) failed to parse" }
          Write-Host "All PowerShell files parse."

      - name: Require UTF-8 BOM on .ps1 files
        shell: pwsh
        run: |
          # Windows PowerShell 5.1 decodes a BOM-less file as ANSI, which turns
          # the Chinese UI strings into mojibake and can break parsing outright.
          # This has bitten the project twice, so it is a build gate.
          $bad = @()
          foreach ($f in Get-ChildItem -Recurse -Filter *.ps1) {
            $b = [IO.File]::ReadAllBytes($f.FullName)
            $hasBom = $b.Length -ge 3 -and $b[0] -eq 0xEF -and $b[1] -eq 0xBB -and $b[2] -eq 0xBF
            if (-not $hasBom) { $bad += $f.FullName; Write-Host "::error file=$($f.FullName)::missing UTF-8 BOM" }
          }
          if ($bad.Count -gt 0) {
            Write-Host "Fix with: pwsh tools/fix-bom.ps1"
            throw "$($bad.Count) file(s) missing the UTF-8 BOM"
          }
          Write-Host "All .ps1 files carry a UTF-8 BOM."

      - name: Syntax check the app backend
        run: |
          node --version
          node --check app/server.js

      - name: Shellcheck the remote service script
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck --severity=warning remote/dsh-web-service.sh || {
            echo "::warning::shellcheck reported warnings (see above)";
          }

      - name: Validate JSON files
        run: |
          for f in .dshproj.example.json; do
            node -e "JSON.parse(require('fs').readFileSync('$f','utf8')); console.log('ok  $f')"
          done

      - name: Verify the launcher documents every command it implements
        shell: pwsh
        run: |
          # Cheap drift guard: every ValidateSet verb must appear in the README.
          $src = Get-Content dsh.ps1 -Raw
          $m = [regex]::Match($src, "ValidateSet\(([^)]+)\)")
          if (-not $m.Success) { throw "could not find the Command ValidateSet in dsh.ps1" }
          $verbs = $m.Groups[1].Value -replace "['\s]", '' -split ','
          $readme = Get-Content README.md -Raw
          $missing = @($verbs | Where-Object { $_ -and $readme -notmatch [regex]::Escape($_) })
          Write-Host "commands: $($verbs -join ', ')"
          if ($missing.Count -gt 0) {
            Write-Host "::warning::commands missing from README: $($missing -join ', ')"
          }

      - name: Panel rendering logic (hint commands, action gating)
        # Extracts the shipped FAIL_STEP and card() from index.html, so the checks
        # track the real rendering logic instead of a copy of it. Runs on every
        # push and needs no Windows.
        run: node tools/check-ui.js

      - name: Status cache guarantees
        # Extracts getStatus/applyStatusRows from app/server.js and runs them
        # against a stubbed probe, so single-flight, the TTL and mutation-folding
        # are verified by counting probes rather than by timing a real ssh
        # handshake. The live latency assertions in tools/check-panel.ps1 cannot
        # run here (they need a running backend and reachable hosts), and they
        # cannot prove deduplication at all without a destructive install, which
        # is why this is a unit test on the extracted functions.
        run: node tools/check-status-cache.js

      - name: Stop-App contract (the verdict, not taskkill's exit code)
        # `app -Stop` reported "app backend was not running" while the backend
        # was still alive, because taskkill printed a "could not be terminated"
        # line on stderr after it had already killed the parent and
        # $ErrorActionPreference='Stop' turned that line into a terminating
        # error. Static half of the guard, so it still runs where taskkill does
        # not exist; the windows job below proves the behaviour end to end.
        run: node tools/check-stop-contract.js

      - name: Machine-readable output stays machine-readable
        shell: pwsh
        run: |
          # CI parsed dsh.ps1 but never executed it, so a `-Json` command that
          # printed a human-readable line to stdout went unnoticed. That is not
          # hypothetical: Write-Host writes to the host output, which is exactly
          # what a caller captures, so "[warn] unknown instance 'x'" ended up in
          # front of the payload and broke every consumer that parses it. One
          # assertion over a harmless command (list reads a config and touches
          # no network) keeps that class of bug out.
          $raw = & ./dsh.ps1 -Command list -Json -Config ./.dshproj.example.json 2>$null
          $text = ($raw | Out-String).Trim()
          if (-not $text) { throw "list -Json produced no output" }
          if ($text -notmatch '^\[') { throw "stdout does not start with a JSON array: $text" }
          $parsed = $text | ConvertFrom-Json
          if ($parsed.Count -lt 1) { throw "expected at least one instance, got $($parsed.Count)" }
          Write-Host "ok  list -Json parsed $($parsed.Count) instance(s) with no chatter on stdout"

  # ---------------------------------------------------------------------------
  # Windows-only behavioural checks. The lint job parses PowerShell; this job
  # RUNS it, because the bug it covers lived in the gap between the two: the
  # sources parsed, the contract was documented in comments, and `app -Stop`
  # still lied about having stopped the panel.
  # ---------------------------------------------------------------------------
  windows-behaviour:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: app -Stop actually stops the panel
        # Starts a real panel from a throwaway copy of this checkout, then
        # intercepts taskkill with a compiled shim that emits the exact stderr
        # line that caused the defect. Asserts the verdict comes from the
        # process table: a backend that died is reported as stopped, a backend
        # that survived is reported as a failure and keeps its runtime file.
        shell: pwsh
        run: pwsh -File tools/check-app-stop.ps1

      - name: A local instance with no dsh says so, and can fix itself
        # The gap this closes: `start` reported "dsh not found" only to a log and
        # nothing installed dsh locally, so the panel showed a card whose start
        # button could never work. npm is hidden behind a compiled stub with a
        # controllable exit code, so npm is never asked to install anything for
        # real - every assertion is about what the launcher REPORTS, including
        # that a stub which exits 0 while dsh is still missing is not a success.
        shell: pwsh
        run: pwsh -File tools/check-local-install.ps1

      - name: The Node runtime can be provided, and only when verified
        # Serves a synthetic nodejs.org from a local directory, so this downloads
        # nothing and installs nothing on the runner. The cases that matter most
        # are the refusals: a checksum mismatch, a zip the checksum list does not
        # cover, and a checksum list that cannot be fetched at all - none of which
        # can be produced against the real nodejs.org without breaking it.
        shell: pwsh
        run: pwsh -File tools/check-node-bootstrap.ps1

      # Git Bash stands in for a remote Linux host: it ships sha256sum, awk, curl
      # and tar, which is everything the provisioning script touches. GitHub's
      # windows runners have it, so the checksum logic is checked for real rather
      # than only parsed.
      - name: Provisioning a host verifies the Node it installs
        shell: pwsh
        run: pwsh -File tools/check-remote-node.ps1

  # ---------------------------------------------------------------------------
  # The app backend is dependency-free, which is a promise worth enforcing: a
  # stray require() of an external package would break "clone and run".
  # ---------------------------------------------------------------------------
  no-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assert the backend uses only Node builtins
        run: |
          node -e '
            const fs = require("fs");
            const src = fs.readFileSync("app/server.js", "utf8");
            const builtins = new Set(require("module").builtinModules);
            const reqs = [...src.matchAll(/require\(["\x27]([^"\x27]+)["\x27]\)/g)].map(m => m[1]);
            const external = reqs.filter(r => !builtins.has(r) && !r.startsWith("."));
            console.log("requires:", [...new Set(reqs)].join(", ") || "(none)");
            if (external.length) {
              console.error("external dependencies found: " + external.join(", "));
              process.exit(1);
            }
            console.log("ok: no external dependencies");
          '
