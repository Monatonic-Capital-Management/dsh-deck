<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- dsh-deck mark: a leaping dolphin in the panel's accent gradient.
       Vector on purpose: the same art has to stay readable at 16 px in the
       taskbar and at 256 px on the desktop. -->
  <defs>
    <linearGradient id="deck" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4d8dff"/>
      <stop offset="1" stop-color="#7c5cff"/>
    </linearGradient>
  </defs>
  <g fill="url(#deck)">
    <!-- body, with the eye punched out as a hole -->
    <path fill-rule="evenodd" d="M236 116
             C220 106 202 100 184 96
             C164 90 140 92 122 98
             C98 106 78 118 62 134
             C58 138 56 142 56 146
             C74 140 96 138 118 140
             C150 143 180 142 200 134
             C214 129 226 124 234 122
             C237 121 238 118 236 116 Z
             M197 106 A8 8 0 1 1 197 122 A8 8 0 1 1 197 106 Z"/>
    <!-- dorsal fin -->
    <path d="M154 90
             C154 70 146 52 132 42
             C136 60 136 78 136 94
             C142 92 148 91 154 90 Z"/>
    <!-- tail fluke -->
    <path d="M66 132
             C52 118 34 108 18 106
             C24 120 34 132 46 141
             C32 148 22 158 16 170
             C36 166 54 157 68 145 Z"/>
    <!-- pectoral fin -->
    <path d="M168 146
             C158 162 146 178 132 190
             C150 184 170 172 186 158
             C180 154 174 150 168 146 Z"/>
  </g>
</svg>
